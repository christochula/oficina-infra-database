name: Terraform CI

on:
  pull_request:
    branches:
      - homolog
      - main
    paths:
      - "**/*.tf"
      - "**/*.tfvars.example"
      - "**/*.tfbackend.example"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: database-plan-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.10.5"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize without backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

  plan:
    name: Plan
    needs: validate
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.base_ref == 'main' && 'production' || 'homolog' }}

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_KMS_KEY_ARN: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TFVARS_JSON: ${{ vars.TFVARS_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required GitHub Environment variables
        shell: bash
        run: |
          required=(
            AWS_REGION AWS_DEPLOY_ROLE_ARN TF_STATE_BUCKET TF_STATE_KEY
            TFVARS_JSON
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub Environment variable: ${name}"
              exit 1
            fi
          done

      - name: Materialize environment tfvars
        shell: bash
        run: |
          printf '%s\n' "${TFVARS_JSON}" > "${RUNNER_TEMP}/environment.auto.tfvars.json"
          jq -e 'type == "object"' "${RUNNER_TEMP}/environment.auto.tfvars.json" > /dev/null

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-database-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Initialize remote state
        shell: bash
        run: |
          backend_args=(
            -backend-config="bucket=${TF_STATE_BUCKET}"
            -backend-config="key=${TF_STATE_KEY}"
            -backend-config="region=${AWS_REGION}"
          )
          if [[ -n "${TF_STATE_KMS_KEY_ARN:-}" ]]; then
            backend_args+=(-backend-config="kms_key_id=${TF_STATE_KMS_KEY_ARN}")
          fi
          terraform init -input=false "${backend_args[@]}"

      - name: Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -no-color -out=tfplan -var-file="${RUNNER_TEMP}/environment.auto.tfvars.json"
